<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <radialGradient id="pBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#F9F6EE"/>
      <stop offset="100%" stop-color="#ECE3D0"/>
    </radialGradient>
    <linearGradient id="plantainRipe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="35%" stop-color="#F2C12E"/>
      <stop offset="70%" stop-color="#D49E17"/>
      <stop offset="100%" stop-color="#8C6308"/>
    </linearGradient>
    <linearGradient id="plantainSemi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D1E057"/>
      <stop offset="40%" stop-color="#ADC934"/>
      <stop offset="80%" stop-color="#839E20"/>
      <stop offset="100%" stop-color="#556910"/>
    </linearGradient>
    <filter id="pShadow">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2D2118" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#pBg)"/>

  <!-- Ground Shadows -->
  <ellipse cx="205" cy="235" rx="130" ry="24" fill="#2B1E12" opacity="0.14"/>

  <!-- Plantain Bunch Stalk -->
  <path d="M200 45 C205 75 195 90 200 110" stroke="#4A3416" stroke-width="18" stroke-linecap="round" fill="none"/>

  <g filter="url(#pShadow)">
    <!-- Rear Plantain (Greenish) -->
    <path d="M195 105 Q120 120 90 185 Q115 220 180 185 Q170 145 195 105 Z" fill="url(#plantainSemi)"/>
    <path d="M90 185 L75 190" stroke="#38250C" stroke-width="6" stroke-linecap="round"/>

    <!-- Left Ripe Finger -->
    <path d="M195 105 Q140 135 110 205 Q150 235 205 195 Q180 155 195 105 Z" fill="url(#plantainRipe)"/>
    <path d="M110 205 L95 212" stroke="#38250C" stroke-width="6" stroke-linecap="round"/>
    <!-- Sugar freckles on ripe plantain -->
    <circle cx="140" cy="180" r="2" fill="#5E430B"/>
    <circle cx="152" cy="192" r="2.5" fill="#5E430B"/>
    <circle cx="165" cy="185" r="2" fill="#5E430B"/>

    <!-- Right Upper Finger -->
    <path d="M205 105 Q280 120 310 185 Q285 220 220 185 Q230 145 205 105 Z" fill="url(#plantainSemi)"/>
    <path d="M310 185 L325 190" stroke="#38250C" stroke-width="6" stroke-linecap="round"/>

    <!-- Center Foreground Curved Finger -->
    <path d="M200 108 Q245 140 270 215 Q220 240 175 205 Q195 160 200 108 Z" fill="url(#plantainRipe)"/>
    <path d="M270 215 L285 222" stroke="#38250C" stroke-width="6" stroke-linecap="round"/>
    <!-- Plantain longitudinal ridge line -->
    <path d="M200 110 Q235 155 240 220" stroke="#FFF" stroke-width="2" opacity="0.35" fill="none"/>
    <circle cx="230" cy="185" r="2" fill="#5E430B"/>
    <circle cx="242" cy="198" r="2.5" fill="#5E430B"/>
  </g>

  <!-- Farm Badge -->
  <g transform="translate(315, 25) scale(0.85)">
    <circle cx="35" cy="35" r="30" fill="#8C6308" opacity="0.9"/>
    <circle cx="35" cy="35" r="27" fill="none" stroke="#FAF7F0" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="35" y="32" font-family="Georgia, serif" font-size="8" font-weight="bold" fill="#FAF7F0" text-anchor="middle">SWEET</text>
    <text x="35" y="44" font-family="sans-serif" font-size="8" font-weight="bold" fill="#FFE066" text-anchor="middle">DODO</text>
  </g>
</svg>
