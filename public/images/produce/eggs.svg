<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <radialGradient id="eBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FBF8F2"/>
      <stop offset="100%" stop-color="#EDE4D2"/>
    </radialGradient>
    <radialGradient id="egg1" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#F7DBC2"/>
      <stop offset="50%" stop-color="#D9A87E"/>
      <stop offset="85%" stop-color="#A86E45"/>
      <stop offset="100%" stop-color="#6B3E1E"/>
    </radialGradient>
    <radialGradient id="egg2" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FCE6D2"/>
      <stop offset="55%" stop-color="#E2B48C"/>
      <stop offset="85%" stop-color="#B57A50"/>
      <stop offset="100%" stop-color="#734422"/>
    </radialGradient>
    <linearGradient id="basketStraw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4B077"/>
      <stop offset="50%" stop-color="#AD8747"/>
      <stop offset="100%" stop-color="#7A5A26"/>
    </linearGradient>
    <filter id="eShadow">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#362211" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#eBg)"/>

  <!-- Ground Shadows -->
  <ellipse cx="200" cy="240" rx="140" ry="26" fill="#2E1C0D" opacity="0.15"/>

  <!-- Wicker Farm Basket -->
  <g filter="url(#eShadow)">
    <ellipse cx="200" cy="205" rx="130" ry="45" fill="#543714"/>
    <path d="M70 205 Q70 250 200 255 Q330 250 330 205 Q200 220 70 205 Z" fill="url(#basketStraw)"/>
    <!-- Wicker basket weave ribs -->
    <path d="M100 210 Q110 240 130 252" stroke="#4A3010" stroke-width="2" fill="none"/>
    <path d="M150 215 Q155 245 170 255" stroke="#4A3010" stroke-width="2" fill="none"/>
    <path d="M200 218 L200 255" stroke="#4A3010" stroke-width="2" fill="none"/>
    <path d="M250 215 Q245 245 230 255" stroke="#4A3010" stroke-width="2" fill="none"/>
    <path d="M300 210 Q290 240 270 252" stroke="#4A3010" stroke-width="2" fill="none"/>
  </g>

  <!-- Golden Straw Bedding -->
  <path d="M85 200 Q200 212 315 200 Q200 185 85 200 Z" fill="#E6C483"/>
  <path d="M120 195 Q140 180 160 198" stroke="#F5DCA6" stroke-width="2" fill="none"/>
  <path d="M220 198 Q240 182 265 195" stroke="#F5DCA6" stroke-width="2" fill="none"/>

  <!-- Farm Eggs nestled in nest -->
  <g filter="url(#eShadow)">
    <!-- Egg Left Rear -->
    <ellipse cx="145" cy="165" rx="32" ry="42" transform="rotate(-18 145 165)" fill="url(#egg1)"/>
    <ellipse cx="138" cy="150" rx="12" ry="18" transform="rotate(-18 138 150)" fill="#FFFFFF" opacity="0.3"/>

    <!-- Egg Right Rear -->
    <ellipse cx="255" cy="165" rx="32" ry="42" transform="rotate(18 255 165)" fill="url(#egg2)"/>
    <ellipse cx="248" cy="150" rx="12" ry="18" transform="rotate(18 248 150)" fill="#FFFFFF" opacity="0.32"/>

    <!-- Center Hero Egg -->
    <ellipse cx="200" cy="170" rx="35" ry="46" fill="url(#egg1)"/>
    <ellipse cx="190" cy="152" rx="14" ry="22" fill="#FFFFFF" opacity="0.35"/>
  </g>

  <!-- Farm Badge -->
  <g transform="translate(315, 25) scale(0.85)">
    <circle cx="35" cy="35" r="30" fill="#6B3E1E" opacity="0.9"/>
    <circle cx="35" cy="35" r="27" fill="none" stroke="#FAF7F0" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="35" y="32" font-family="Georgia, serif" font-size="8" font-weight="bold" fill="#FAF7F0" text-anchor="middle">JUMBO</text>
    <text x="35" y="44" font-family="sans-serif" font-size="8" font-weight="bold" fill="#FCE6D2" text-anchor="middle">EGGS</text>
  </g>
</svg>
