<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <radialGradient id="gBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FAF8F2"/>
      <stop offset="100%" stop-color="#EBE3D0"/>
    </radialGradient>
    <linearGradient id="sackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C2A882"/>
      <stop offset="50%" stop-color="#9E835E"/>
      <stop offset="100%" stop-color="#735B3B"/>
    </linearGradient>
    <radialGradient id="garriMound" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FAF7EC"/>
      <stop offset="90%" stop-color="#EDE6D1"/>
      <stop offset="100%" stop-color="#D9CFAE"/>
    </radialGradient>
    <filter id="gShadow">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#3D3020" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#gBg)"/>

  <!-- Ground Shadows -->
  <ellipse cx="200" cy="245" rx="130" ry="22" fill="#2E2314" opacity="0.15"/>

  <!-- Woven Jute Sack Base -->
  <g filter="url(#gShadow)">
    <path d="M115 155 Q80 200 110 245 Q200 255 290 245 Q320 200 285 155 Q200 145 115 155 Z" fill="url(#sackGrad)"/>
    <!-- Sack folded lip -->
    <path d="M105 160 Q200 175 295 160 Q305 145 285 140 Q200 152 115 140 Q95 145 105 160 Z" fill="#B39872"/>
    <!-- Jute crossweave lines -->
    <path d="M135 170 Q140 210 145 245" stroke="#7A6345" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
    <path d="M185 175 Q188 215 190 250" stroke="#7A6345" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
    <path d="M235 175 Q232 215 230 250" stroke="#7A6345" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
    <path d="M270 170 Q265 210 260 245" stroke="#7A6345" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
  </g>

  <!-- Mounded Crispy White Garri Grains -->
  <g filter="url(#gShadow)">
    <path d="M115 150 Q200 80 285 150 Q200 170 115 150 Z" fill="url(#garriMound)"/>
    <!-- Crisp grain dots in foreground -->
    <circle cx="160" cy="130" r="1.5" fill="#C2B897"/>
    <circle cx="175" cy="120" r="1.5" fill="#C2B897"/>
    <circle cx="195" cy="115" r="2" fill="#D6CCA9"/>
    <circle cx="215" cy="122" r="1.5" fill="#C2B897"/>
    <circle cx="235" cy="132" r="1.8" fill="#C2B897"/>
    <circle cx="180" cy="140" r="1.8" fill="#C2B897"/>
    <circle cx="205" cy="138" r="1.5" fill="#C2B897"/>
    <circle cx="225" cy="145" r="2" fill="#C2B897"/>
  </g>

  <!-- Calabash wooden scoop resting in garri -->
  <path d="M240 140 Q310 90 325 80 Q335 90 270 155 Z" fill="#8A582E"/>
  <path d="M240 140 Q255 125 270 155 Q252 155 240 140 Z" fill="#5E3816"/>

  <!-- Farm Badge -->
  <g transform="translate(315, 25) scale(0.85)">
    <circle cx="35" cy="35" r="30" fill="#735B3B" opacity="0.9"/>
    <circle cx="35" cy="35" r="27" fill="none" stroke="#FAF7F0" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="35" y="32" font-family="Georgia, serif" font-size="8" font-weight="bold" fill="#FAF7F0" text-anchor="middle">IJEBU</text>
    <text x="35" y="44" font-family="sans-serif" font-size="8" font-weight="bold" fill="#FCE9C2" text-anchor="middle">CRISPY</text>
  </g>
</svg>
